[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trialrig"
version = "0.2.0"
description = "Run repeatable A/B trials of coding agents (Claude Code, Codex, Cursor, Copilot) and report cost and correctness with honest statistics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
trialrig = "trialrig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
trialrig = ["example.toml"]
