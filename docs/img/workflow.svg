<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1028 172" width="1028" height="172" role="img" aria-label="How a trial runs"><title>How a trial runs</title><style>
:root{--bg:#fbfaf7;--fg:#1d2330;--mut:#6b7385;--line:#c9cdd6;--box:#ffffff;--acc:#2f5fd0;--accbg:#e8eefc;--a:#2f5fd0;--b:#c2410c;--grid:#e6e8ee}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--fg:#e8eaf0;--mut:#9aa2b5;--line:#3a4152;--box:#1c212c;--acc:#7aa2ff;--accbg:#1f2a47;--a:#7aa2ff;--b:#f0a35a;--grid:#262c3a}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg);font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mut{fill:var(--mut)}.h{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;fill:var(--mut)}
.box{fill:var(--box);stroke:var(--line)}.root{fill:var(--accbg);stroke:var(--acc)}
.ln{stroke:var(--acc);fill:none;stroke-width:1.6}.grid{stroke:var(--grid);stroke-width:1}.bg{fill:var(--bg)}
</style><rect class="bg" width="1028" height="172" rx="10"/><rect class="box" x="24" y="30" width="140" height="88" rx="8"/><text x="38" y="58" style="font-weight:600">Trial file</text><text class="mut" x="38" y="80">repos, arms,</text><text class="mut" x="38" y="97">agents, questions</text><rect class="box" x="192" y="30" width="140" height="88" rx="8"/><text x="206" y="58" style="font-weight:600">Fresh clone</text><text class="mut" x="206" y="80">one per run,</text><text class="mut" x="206" y="97">arm setup applied</text><path class="ln" d="M168 74 L187 74"/><path class="ln" d="M181 68 L187 74 L181 80"/><rect class="root" x="360" y="30" width="140" height="88" rx="8"/><text x="374" y="58" style="font-weight:600">Agent runs</text><text class="mut" x="374" y="80">Claude Code, Codex,</text><text class="mut" x="374" y="97">Cursor, Copilot</text><path class="ln" d="M336 74 L355 74"/><path class="ln" d="M349 68 L355 74 L349 80"/><rect class="box" x="528" y="30" width="140" height="88" rx="8"/><text x="542" y="58" style="font-weight:600">Parse</text><text class="mut" x="542" y="80">tokens, tool calls,</text><text class="mut" x="542" y="97">answer, cost</text><path class="ln" d="M504 74 L523 74"/><path class="ln" d="M517 68 L523 74 L517 80"/><rect class="box" x="696" y="30" width="140" height="88" rx="8"/><text x="710" y="58" style="font-weight:600">Score</text><text class="mut" x="710" y="80">answer key,</text><text class="mut" x="710" y="97">verify command</text><path class="ln" d="M672 74 L691 74"/><path class="ln" d="M685 68 L691 74 L685 80"/><rect class="root" x="864" y="30" width="140" height="88" rx="8"/><text x="878" y="58" style="font-weight:600">Report</text><text class="mut" x="878" y="80">relative cost,</text><text class="mut" x="878" y="97">interval, verdict</text><path class="ln" d="M840 74 L859 74"/><path class="ln" d="M853 68 L859 74 L853 80"/><text class="mut" x="24" y="152">Every (question, arm, agent, repetition) is one run. Finished runs are kept, so an interrupted trial resumes.</text></svg>