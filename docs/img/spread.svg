.box{fill:var(--box);stroke:var(--line)}.root{fill:var(--accbg);stroke:var(--acc)}
.ln{stroke:var(--acc);fill:none;stroke-width:1.6}.grid{stroke:var(--grid);stroke-width:1}.bg{fill:var(--bg)}
