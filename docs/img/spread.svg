<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 366" width="850" height="366" role="img" aria-label="Tokens per run in a real trial"><title>Tokens per run in a real trial</title><style>
:root{--bg:#fbfaf7;--fg:#1d2330;--mut:#6b7385;--line:#c9cdd6;--box:#ffffff;--acc:#2f5fd0;--accbg:#e8eefc;--a:#2f5fd0;--b:#c2410c;--grid:#e6e8ee}
